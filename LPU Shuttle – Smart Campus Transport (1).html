<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LPU Shuttle – Smart Campus Transport</title>
<style>
:root{--red:#1E4FD8;--or:#F97316;--red2:#173A9E;--bg:#FFFFFF;--card:#fff;--tx:#0F2A5C;--mu:#5B6B8C;--ln:#E3E9F5;--sh:0 4px 16px rgba(30,79,216,.10);--out:#EEF3FF;color-scheme:light only;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--out);font:14px/1.4 Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--tx);display:flex;align-items:center;justify-content:center}
#ph{width:390px;height:844px;max-width:100vw;max-height:100%;background:var(--bg);position:relative;overflow:hidden;border-radius:28px;box-shadow:0 20px 60px rgba(30,79,216,.2);display:flex;flex-direction:column}
@media(max-width:430px){#ph{border-radius:0;width:100vw;height:100%}}
#scr{flex:1;overflow-y:auto;padding:0 18px 20px}#scr.nb{padding-bottom:20px}
.top{display:flex;align-items:center;gap:10px;padding:16px 0 12px;position:sticky;top:0;background:var(--bg);z-index:5}
.top h2{margin:0;font-size:19px;flex:1}.ib{width:38px;height:38px;border-radius:12px;background:var(--card);box-shadow:var(--sh);border:1px solid var(--ln);color:var(--tx);display:grid;place-items:center;cursor:pointer;flex:none}
.card{background:var(--card);border:1px solid var(--ln);border-radius:18px;box-shadow:var(--sh);padding:14px;margin-bottom:12px}
.btn{width:100%;border:0;border-radius:14px;padding:14px;font:600 15px inherit;font-family:inherit;cursor:pointer;background:var(--red);color:#fff;box-shadow:0 6px 14px rgba(30,79,216,.3);margin-top:8px}
.btn.o{background:var(--card);color:var(--red);box-shadow:none;border:1.5px solid var(--red)}.btn.w{background:#fff;color:var(--or);box-shadow:none}.btn.s{width:auto;padding:9px 14px;font-size:13px;margin:0}
.btn:active{transform:scale(.98)}
input,select,textarea{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--ln);background:var(--card);color:var(--tx);font:inherit;margin-bottom:10px;outline:0}input:focus,select:focus,textarea:focus{border-color:var(--red)}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}.mu{color:var(--mu);font-size:12.5px}.b{font-weight:700}.r{color:var(--red)}
.nav{display:flex;background:var(--card);border-top:1px solid var(--ln);padding:8px 6px 12px;flex:none}
.nav button{flex:1;border:0;background:0;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px;font:600 11px inherit;font-family:inherit;cursor:pointer;position:relative}.nav button.on{color:var(--red)}
.dot{position:absolute;top:-2px;right:22px;background:var(--or);color:#fff;border-radius:9px;font-size:9px;padding:1px 5px}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700}.Low,.ok{background:#DCFCE7;color:#15803D}.Moderate,.wn{background:#FEF3C7;color:#B45309}.High,.er{background:#FEE2E2;color:#B91C1C}.gy{background:var(--ln);color:var(--mu)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.q{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;cursor:pointer;font-weight:600}
.q i{width:44px;height:44px;border-radius:14px;background:#E8EFFF;color:var(--red);display:grid;place-items:center}
.ic{width:40px;height:40px;border-radius:12px;background:#E8EFFF;color:var(--red);display:grid;place-items:center;flex:none}
.li{display:flex;align-items:center;gap:12px;padding:13px 14px;cursor:pointer}.li+.li{border-top:1px solid var(--ln)}
.hero{height:430px;margin:0 -18px;background:linear-gradient(160deg,#1E4FD8,#12307F);position:relative;border-radius:0 0 36px 36px;overflow:hidden;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:24px}
.lg{background:#fff;border-radius:16px;padding:6px 10px;box-shadow:var(--sh);display:block}.lg img{display:block;height:64px;width:auto}.logo{width:58px;height:58px;border-radius:16px;background:#fff;color:var(--red);font-weight:900;display:grid;place-items:center;font-size:19px;box-shadow:var(--sh)}
.tabs{display:flex;background:var(--ln);border-radius:12px;padding:4px;margin-bottom:12px}.tabs button{flex:1;border:0;background:0;padding:9px;border-radius:9px;font:600 13px inherit;font-family:inherit;color:var(--mu);cursor:pointer}.tabs button.on{background:var(--card);border-bottom:2px solid var(--or);color:var(--red);box-shadow:var(--sh)}
.sk{height:120px;border-radius:18px;margin-bottom:12px;background:linear-gradient(90deg,var(--ln) 25%,var(--card) 50%,var(--ln) 75%);background-size:200% 100%;animation:sh 1.2s infinite}@keyframes sh{to{background-position:-200% 0}}
.spin{width:64px;height:64px;border-radius:50%;border:6px solid var(--ln);border-top-color:var(--red);animation:rt 1s linear infinite;margin:auto}@keyframes rt{to{transform:rotate(360deg)}}
.ctr{text-align:center;padding:40px 10px}.tick{width:96px;height:96px;border-radius:50%;background:#16A34A;display:grid;place-items:center;margin:0 auto 16px;color:#fff;animation:pop .5s}@keyframes pop{from{transform:scale(.2);opacity:0}}
.ov{position:absolute;inset:0;background:rgba(15,42,92,.45);display:flex;align-items:flex-end;z-index:20;animation:fd .2s}@keyframes fd{from{opacity:0}}
.mod{background:var(--card);width:100%;border-radius:26px 26px 0 0;padding:22px 20px 26px;max-height:85%;overflow:auto}
.toast{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);background:#1E4FD8;color:#fff;padding:10px 18px;border-radius:24px;font-size:13px;z-index:30;white-space:nowrap}
.pm{display:flex;align-items:center;gap:12px;padding:12px;border:1.5px solid var(--ln);border-radius:14px;margin-bottom:8px;cursor:pointer}.pm.on{border-color:var(--red);background:#E8EFFF55}
.rd{width:18px;height:18px;border-radius:50%;border:2px solid var(--ln);margin-left:auto}.on>.rd{border:5px solid var(--red)}
.sw{width:44px;height:26px;border-radius:14px;background:var(--ln);position:relative;margin-left:auto;cursor:pointer;flex:none}.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}.sw.on{background:var(--red)}.sw.on::after{left:21px}
.star{font-size:30px;cursor:pointer;color:var(--ln)}.star.on{color:var(--or)}
.tk{background:var(--card);border-radius:22px;box-shadow:var(--sh);overflow:hidden}.tk .hd{background:var(--red);color:#fff;padding:16px}.tk .bd{padding:16px}.tk .cut{border-top:2px dashed var(--ln);margin:0 -16px}

<div class="card">${[['Pickup',S.from],['Destination',S.to],['Stops',S.route.st.length+' stops'],['ETA',S.route.eta+' min'],['Trip duration',S.route.d+' min'],['Date','Today, 25 Nov 2026'],['Departure',new Date(Date.now()+S.route.eta*6e4).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})],['Seats left',S.route.o=='High'?'4':S.route.o=='Low'?'22':'11']].map(a=>`<div class="row sp" style="padding:7px 0"><span class="mu">${a[0]}</span><b>${a[1]}</b></div>`).join('')}<div style="border-top:1px dashed var(--ln);margin-top:6px;padding-top:10px" class="row sp"><b>Fare</b><b style="font-size:20px;color:var(--or)">₹${S.route.f}</b></div></div>
<button class="btn o" onclick="go('track')">${I('pin',16)} Track This Shuttle</button><button class="btn" onclick="confirmB()">Confirm Booking</button>`,
pay:()=>`${hd('Payment','<span class="pill gy">Demo only</span>')}<div class="card"><div class="row sp"><span class="mu">Booking ID</span><b>${S.cur.id}</b></div><div class="mu" style="margin:8px 0">${S.cur.r.id} · ${S.cur.from} → ${S.cur.to}<br>${S.cur.date}, ${S.cur.time}</div><div class="row sp"><span class="mu">Fare</span><span>₹${S.cur.fare}</span></div>${S.coupon?`<div class="row sp"><span class="mu">Coupon (LPU10)</span><span class="ok pill">−₹${S.coupon}</span></div>`:''}<div class="row sp" style="border-top:1px dashed var(--ln);margin-top:8px;padding-top:8px"><b>Total</b><b style="font-size:20px;color:var(--or)">₹${total()}</b></div></div>
<div class="b" style="margin:4px 2px 8px">Payment method</div>${[['UPI','upi','Pay with any UPI app'],['Card','card','Credit / Debit card'],['Net Banking','bank','All major banks'],['Wallet','wallet','Paytm, PhonePe, LPU Wallet']].map(m=>`<div class="pm ${S.pm==m[0]?'on':''}" onclick="S.pm='${m[0]}';render()"><div class="ic">${I(m[1])}</div><div><div class="b">${m[0]}</div><div class="mu">${m[2]}</div></div><div class="rd"></div></div>`).join('')}
<button class="btn o" onclick="coupon()">🏷️ Apply Coupon</button><button class="btn" onclick="payNow()">Pay Now · ₹${total()}</button>`,
proc:()=>`<div class="ctr" style="padding-top:200px"><div class="spin"></div><h2 style="margin:24px 0 6px">Processing payment…</h2><div class="mu">Please don’t close the app</div></div>`,
success:()=>`<div class="ctr" style="padding-top:90px"><div class="tick">${I('check',52)}</div><h2 style="margin:0 0 6px">Payment Successful!</h2><div class="mu">₹${S.cur.paid} paid via ${S.cur.pm} · Booking ${S.cur.id}</div><div style="margin-top:30px"><button class="btn" onclick="go('ticket')">View Digital Ticket</button><button class="btn o" onclick="receipt()">View Receipt</button><button class="btn o" style="border-color:var(--ln);color:var(--mu)" onclick="home()">Back to Dashboard</button></div></div>`,
ticket:()=>{const b=S.cur||S.B[0];return `${hd('Digital Ticket')}<div class="tk"><div class="hd row sp"><div><div style="opacity:.8;font-size:12px">LPU SHUTTLE</div><div class="b" style="font-size:18px">${b.r.id} · ${b.r.n}</div></div><span class="pill ok">${b.s=='Upcoming'?'Confirmed':b.s}</span></div><div class="bd">${[['Passenger',S.user.name],['Student ID',S.user.id],['Booking ID',b.id],['Pickup',b.from],['Destination',b.to],['Date & time',b.date+', '+b.time],['Payment',b.paid?'Paid ✔':'Pay at boarding']].map(a=>`<div class="row sp" style="padding:6px 0"><span class="mu">${a[0]}</span><b style="text-align:right">${a[1]}</b></div>`).join('')}<div class="cut" style="margin:12px -16px"></div><div style="text-align:center;padding:6px"><svg width="150" height="150" viewBox="0 0 10 10" fill="currentColor">${[...Array(100)].map((_,i)=>(i*7+i%3*5+(i>>2))%3==0||[0,1,2,10,12,20,21,22,7,8,9,17,19,27,28,29,70,71,72,80,82,90,91,92].includes(i)?`<rect x="${i%10}" y="${(i/10)|0}" width="1" height="1"/>`:'').join('')}</svg><div class="mu">QR placeholder · show to driver</div></div></div></div><button class="btn" onclick="home()">Back to Dashboard</button>`},
bookings:()=>{const l=S.B.filter(b=>b.s==S.bt);return `<div class="top" style="padding-top:20px"><h2 style="font-size:22px">My Bookings</h2></div><div class="tabs">${['Upcoming','Completed','Cancelled'].map(t=>`<button class="${S.bt==t?'on':''}" onclick="S.bt='${t}';render()">${t}</button>`).join('')}</div>${l.length?l.map(b=>`<div class="card"><div class="row sp"><b>${b.r.n}</b><span class="pill ${b.s=='Upcoming'?'ok':b.s=='Completed'?'gy':'er'}">${b.s}</span></div><div class="mu" style="margin:6px 0">${b.id} · ${b.from} → ${b.to}<br>${b.date}, ${b.time} · ₹${b.fare}</div><div class="row">${b.s!='Cancelled'?`<button class="btn s" onclick="S.cur=S.B.find(x=>x.id=='${b.id}');go('ticket')">View Ticket</button>`:''}${b.s=='Upcoming'?`<button class="btn s o" onclick="cancelB('${b.id}')">Cancel</button>`:''}${b.s=='Completed'?`<button class="btn s o" onclick="go('help')">Rate</button>`:''}${b.s=='Cancelled'?`<button class="btn s o" onclick="go('pick')">Book Again</button>`:''}</div></div>`).join(''):`<div class="ctr"><div style="font-size:54px">🎫</div><h3>No ${S.bt.toLowerCase()} bookings</h3><div class="mu">Your ${S.bt.toLowerCase()} trips will show up here.</div><button class="btn" style="width:auto;padding:12px 24px" onclick="go('pick')">Book a Shuttle</button></div>`}`},
hist:()=>{const l=S.B.filter(b=>b.paid||b.s=='Completed');return `${hd('Payment History')}${l.length?l.map(b=>`<div class="card row" style="cursor:pointer" onclick="S.cur=S.B.find(x=>x.id=='${b.id}');receipt(1)"><div class="ic">${I('card')}</div><div style="flex:1"><div class="b">${b.r.id} · ${b.from} → ${b.to}</div><div class="mu">${b.date} · ${b.id}</div></div><b>₹${b.paid??b.fare}</b></div>`).join(''):'<div class="ctr"><div style="font-size:54px">🧾</div><h3>No payments yet</h3></div>'}`},
notifs:()=>`<div class="top" style="padding-top:20px"><h2 style="font-size:22px">Notifications</h2>${S.N.length?'<button class="btn s o" onclick="S.N=[];render()">Clear all</button>':''}</div>${S.N.length?S.N.map((n,i)=>`<div class="card row" style="cursor:pointer" onclick="${n.to=='routes'?'searchR()':`go('${n.to}')`}"><div class="ic">${I(n.k)}</div><div style="flex:1"><div class="b">${n.t}</div><div class="mu">${n.m}</div></div><span class="mu">${n.a}</span></div>`).join(''):`<div class="ctr"><div style="font-size:54px">🔔</div><h3>You’re all caught up</h3><div class="mu">No new notifications.</div></div>`}`,
profile:()=>`<div class="top" style="padding-top:20px"><h2 style="font-size:22px">Profile & Settings</h2></div><div class="card row"><div class="logo" style="width:60px;height:60px;border-radius:50%;background:var(--red);color:#fff;font-size:22px">${S.user.name[0]}</div><div style="flex:1"><div class="b" style="font-size:17px">${S.user.name}</div><div class="mu">ID ${S.user.id} · ${S.user.email}</div></div><button class="ib" onclick="editP()" aria-label="Edit">${I('edit')}</button></div><button class="btn o" style="margin:0 0 12px" onclick="editP()">Edit Profile</button>
<div class="card" style="padding:0">${[['bell','Push notifications','push'],['clock','Delay alerts','delay'],['info','Route change alerts','route']].map(a=>`<div class="li"><div class="ic">${I(a[0])}</div><b>${a[1]}</b><div class="sw ${S.notif[a[2]]?'on':''}" onclick="S.notif.${a[2]}^=1;render()"></div></div>`).join('')}</div>
<div class="card" style="padding:0">${[['card','Payment History',"go('hist')"],['help','Help & Feedback',"go('help')"],['info','About LPU Shuttle',"about()"],['out','Logout',"logout()"]].map(a=>`<div class="li" onclick="${a[2]}"><div class="ic">${I(a[0])}</div><b ${a[0]=='out'?'class="r"':''}>${a[1]}</b><span style="margin-left:auto;color:var(--mu)">${I('chev',16)}</span></div>`).join('')}</div>`,
help:()=>`${hd('Help & Feedback')}<div class="b" style="margin:0 2px 8px">FAQs</div><div class="card" style="padding:0">${[['How do I book a shuttle?','Go to Book Shuttle, pick stops, choose a route and confirm.'],['Can I cancel a booking?','Yes, from My Bookings → Cancel before departure.'],['Is payment real?','No. This prototype uses demo payments only.']].map((f,i)=>`<div class="li" style="display:block" onclick="this.querySelector('p').hidden^=1"><b>${f[0]}</b><p hidden class="mu" style="margin:6px 0 0">${f[1]}</p></div>`).join('')}</div>
<div class="grid"><button class="btn o" style="margin:0 0 12px" onclick="support()">${I('msg',16)} Contact Support</button><button class="btn o" style="margin:0 0 12px" onclick="report()">⚠️ Report Problem</button></div>
<div class="card"><b>Rate your journey</b><div class="row" style="margin:6px 0">${[1,2,3,4,5].map(n=>`<span class="star ${S.stars>=n?'on':''}" onclick="S.stars=${n};render()">★</span>`).join('')}</div><textarea id="fb" rows="3" placeholder="Tell us about your ride…"></textarea><button class="btn" onclick="sendFb()">Submit Feedback</button></div>`};
const NAV=[['home','Home','home'],['track','Track','pin'],['bookings','Bookings','tix'],['notifs','Alerts','bell'],['profile','Profile','user']];
function render(){clearInterval(T);closeM();const c=cur();$('scr').innerHTML=V[c]();$('scr').scrollTop=0;
 const main=TABS[c];$('navw').innerHTML=(main&&!['welcome','auth'].includes(c))?`<div class="nav">${NAV.map(n=>`<button class="${c==n[0]?'on':''}" onclick="tab('${n[0]}')">${I(n[2],22)}${n[1]}${n[0]=='notifs'&&unread()?`<span class="dot">${unread()}</span>`:''}</button>`).join('')}</div>`:'';
 if(c=='track')startTrack();}
function startTrack(){S.p=Math.max(S.p,.05);upd();T=setInterval(()=>{S.p=Math.min(1,S.p+.012);upd();if(S.p>=1){clearInterval(T);toast('Shuttle has arrived 🚌')}},800)}
function upd(){const b=$('pb');if(!b)return;const L=b.getTotalLength(),pt=b.getPointAtLength(S.p*L);$('bus').setAttribute('transform',`translate(${pt.x},${pt.y})`);$('pr').setAttribute('stroke-dasharray',S.p*L+' '+L);
 [0,.25,.5,.75,1].forEach((f,i)=>{const q=b.getPointAtLength(f*L);$('s'+i).setAttribute('cx',q.x);$('s'+i).setAttribute('cy',q.y)});
 const a=b.getPointAtLength(0),z=b.getPointAtLength(L);$('pk').setAttribute('transform',`translate(${a.x},${a.y-26})`);$('ds').setAttribute('transform',`translate(${z.x},${z.y-26})`);
 $('eta').textContent=Math.max(0,Math.ceil((1-S.p)*S.route.d));$('dst').textContent=((1-S.p)*2.4).toFixed(1)}
function searchR(){if(S.from==S.to){toast('Pick different stops');return}S.load=1;go('routes');setTimeout(()=>{S.load=0;if(cur()=='routes')render()},1300)}
function doAuth(){const sid=$('sid').value.trim(),pw=$('pw').value;if(!sid||!pw){toast('Enter Student ID and password');return}
 if($('fn')&&$('fn').value)S.user.name=$('fn').value;S.user.id=sid;if($('em').value)S.user.email=$('em').value;S.guest=0;
 $('scr').innerHTML='<div class="ctr" style="padding-top:240px"><div class="spin"></div><div class="mu" style="margin-top:20px">Signing you in…</div></div>';setTimeout(()=>{S.hist=['home'];render()},1100)}
function forgot(){modal(`<h3 style="margin-top:0">Reset password</h3><div class="mu" style="margin-bottom:10px">We’ll email a reset link.</div><input id="re" placeholder="LPU email"><button class="btn" onclick="closeM();toast('Reset link sent ✔')">Send Link</button><button class="btn o" onclick="closeM()">Cancel</button>`)}
function confirmB(){modal(`<h3 style="margin-top:0">Confirm booking?</h3><div class="mu" style="margin-bottom:6px">${S.route.n} (${S.route.id})<br>${S.from} → ${S.to} · Fare ₹${S.route.f}</div><button class="btn" onclick="mk()">Yes, Confirm</button><button class="btn o" onclick="closeM()">Go Back</button>`)}
function mk(){S.coupon=0;S.cur={id:'LPU-B'+(2000+Math.floor(Math.random()*999)),r:S.route,from:S.from,to:S.to,date:'25 Nov 2026',time:new Date(Date.now()+S.route.eta*6e4).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),fare:S.route.f,s:'Upcoming'};modal(`<div class="ctr" style="padding:10px"><div class="tick" style="width:72px;height:72px">${I('check',38)}</div><h3 style="margin:0">Booking confirmed!</h3><div class="mu">ID ${S.cur.id}</div></div><button class="btn" onclick="go('pay')">Proceed to Payment</button>`)}
function coupon(){modal(`<h3 style="margin-top:0">Apply coupon</h3><input id="cp" placeholder="Try LPU10" value="${S.coupon?'LPU10':''}"><button class="btn" onclick="if($('cp').value.toUpperCase()=='LPU10'){S.coupon=Math.min(2,S.cur.fare);render();toast('Coupon applied')}else{toast('Invalid coupon')}">Apply</button><button class="btn o" onclick="closeM()">Close</button>`)}
function payNow(){go('proc');setTimeout(()=>{if(cur()!='proc')return;S.cur.paid=total();S.cur.pm=S.pm;S.B.unshift(S.cur);S.N.unshift({t:'Payment successful',m:'₹'+S.cur.paid+' paid via '+S.pm+'.',k:'card',to:'hist',a:'now'},{t:'Booking confirmed',m:S.cur.id+' on '+S.cur.r.id,k:'tix',to:'bookings',a:'now'});S.hist.pop();go('success')},2200)}
function receipt(){const b=S.cur;modal(`<h3 style="margin-top:0">Receipt</h3>${[['Booking',b.id],['Shuttle',b.r.id],['Trip',b.from+' → '+b.to],['Method',b.pm||'UPI'],['Amount paid','₹'+(b.paid??b.fare)],['Status','Paid ✔']].map(a=>`<div class="row sp" style="padding:6px 0"><span class="mu">${a[0]}</span><b>${a[1]}</b></div>`).join('')}<button class="btn" onclick="closeM()">Done</button>`)}
function cancelB(id){modal(`<h3 style="margin-top:0">Cancel this booking?</h3><div class="mu" style="margin-bottom:6px">${id} will be cancelled and any payment refunded to your source.</div><button class="btn" onclick="S.B.find(b=>b.id=='${id}').s='Cancelled';S.bt='Cancelled';render();toast('Booking cancelled')">Yes, Cancel</button><button class="btn o" onclick="closeM()">Keep Booking</button>`)}
function editP(){modal(`<h3 style="margin-top:0">Edit profile</h3><input id="en" value="${S.user.name}"><input id="ee" value="${S.user.email}"><button class="btn" onclick="S.user.name=$('en').value||S.user.name;S.user.email=$('ee').value||S.user.email;render();toast('Profile updated ✔')">Save</button><button class="btn o" onclick="closeM()">Cancel</button>`)}
function about(){modal(`<div class="ctr" style="padding:10px"><div class="logo" style="margin:auto;background:var(--red);color:#fff">LPU</div><h3>LPU Shuttle v1.0</h3><div class="mu">P05 – Waiting for the Shuttle<br>Smart Campus Transport prototype</div></div><button class="btn" onclick="closeM()">Close</button>`)}
function logout(){modal(`<h3 style="margin-top:0">Log out?</h3><button class="btn" onclick="S.hist=['welcome'];render()">Logout</button><button class="btn o" onclick="closeM()">Stay</button>`)}
function support(){modal(`<h3 style="margin-top:0">Contact Support</h3>${[['📞','Call Transport Office'],['✉️','Email support@lpu.in'],['💬','Live chat']].map(a=>`<div class="pm" onclick="closeM();toast('Opening ${a[1]}…')"><span style="font-size:22px">${a[0]}</span><b>${a[1]}</b></div>`).join('')}<button class="btn o" onclick="closeM()">Close</button>`)}
function report(){modal(`<h3 style="margin-top:0">Report a problem</h3><select><option>Shuttle late</option><option>Wrong route</option><option>Payment issue</option><option>App bug</option></select><textarea rows="3" placeholder="Describe the issue"></textarea><button class="btn" onclick="closeM();toast('Report submitted ✔')">Submit</button><button class="btn o" onclick="closeM()">Cancel</button>`)}
function sendFb(){if(!S.stars&&!$('fb').value){toast('Add a rating or comment');return}S.stars=0;modal(`<div class="ctr" style="padding:10px"><div class="tick" style="width:72px;height:72px">${I('check',38)}</div><h3 style="margin:0">Thanks for your feedback!</h3></div><button class="btn" onclick="home()">Back to Dashboard</button>`)}
render();
</script></body></html>
